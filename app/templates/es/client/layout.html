<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Akdmia{% endblock %}</title>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Reset & Base -->
    <style>
        :root {
            --stripe-indigo: #635bff;
            --stripe-indigo-light: #7a73ff;
            --stripe-indigo-soft: #f0f4ff;
            --stripe-dark: #0a2540;
            --stripe-slate: #424770;
            --stripe-light: #adbdcc;
            --bg-main: #f6f9fc;
            --sidebar-width: 260px;
            --sidebar-collapsed: 72px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--stripe-slate);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
            width: var(--sidebar-width);
            background: #ffffff;
            height: 100vh;
            border-right: 1px solid #e6ebf1;
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 1000;
            transition: var(--transition);
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed);
        }

        .sidebar-header {
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            height: 80px;
        }

        .logo-box {
            background: var(--stripe-indigo);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo-text {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--stripe-dark);
            white-space: nowrap;
            transition: var(--transition);
        }

        .sidebar.collapsed .logo-text {
            opacity: 0;
            pointer-events: none;
        }

        /* Navigation Links */
        .sidebar-nav {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
        }

        .nav-group {
            margin-bottom: 24px;
        }

        .nav-label {
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--stripe-light);
            padding: 0 12px 8px;
            transition: var(--transition);
        }

        .sidebar.collapsed .nav-label {
            opacity: 0;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            text-decoration: none;
            color: var(--stripe-slate);
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            transition: var(--transition);
            margin-bottom: 2px;
        }

        .nav-link:hover {
            background: var(--stripe-indigo-soft);
            color: var(--stripe-indigo);
        }

        .nav-link.active {
            background: var(--stripe-indigo-soft);
            color: var(--stripe-indigo);
        }

        .nav-link svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .nav-link span {
            white-space: nowrap;
            transition: var(--transition);
        }

        .sidebar.collapsed .nav-link span {
            opacity: 0;
        }

        /* Main Content */
        .main-wrapper {
            flex: 1;
            margin-left: var(--sidebar-width);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .sidebar.collapsed+.main-wrapper {
            margin-left: var(--sidebar-collapsed);
        }

        /* Top Header */
        header {
            background: #ffffff;
            height: 64px;
            border-bottom: 1px solid #e6ebf1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 900;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .cycle-badge {
            background: #fef2f2;
            color: #dc2626;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background: var(--stripe-indigo);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 13px;
        }

        content {
            padding: 32px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        /* Mobile Adjustments */
        @media (max-width: 991px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.active {
                transform: translateX(0);
                width: var(--sidebar-width);
            }

            .main-wrapper {
                margin-left: 0 !important;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-box">
                <svg viewBox="0 0 24 24" fill="white" width="18" height="18">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5-10-5-10 5z" />
                </svg>
            </div>
            <span class="logo-text">Akdmia</span>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-group">
                <div class="nav-label">Admisiones</div>
                <a href="/client/admissions" class="nav-link {% if active_page == 'admissions' %}active{% endif %}">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                        </path>
                    </svg>
                    <span>Solicitudes</span>
                </a>
            </div>

            <div class="nav-group">
                <div class="nav-label">Estudiantes</div>
                <a href="/client/students" class="nav-link {% if active_page == 'students' %}active{% endif %}">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
                        </path>
                    </svg>
                    <span>Expedientes</span>
                </a>
                <a href="/client/attendance" class="nav-link">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                        </path>
                    </svg>
                    <span>Asistencia</span>
                </a>
                <a href="/client/grades" class="nav-link {% if active_page == 'grades' %}active{% endif %}">
                    <i class="fas fa-edit" style="width: 20px; font-size: 16px;"></i>
                    <span>Digitación de Notas</span>
                </a>
                <a href="/client/classroom-assignment"
                    class="nav-link {% if active_page == 'classroom_assignment' %}active{% endif %}">
                    <i class="fas fa-chalkboard-teacher" style="width: 20px; font-size: 16px;"></i>
                    <span>Asignación de Aulas</span>
                </a>
            </div>

            <div class="nav-group">
                <div class="nav-label">Configuración</div>
                <a href="/client/config/cycles" class="nav-link">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                        </path>
                    </svg>
                    <span>Ciclos Escolares</span>
                </a>
                <a href="/client/config/courses" class="nav-link">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                        </path>
                    </svg>
                    <span>Cursos y Niveles</span>
                </a>
            </div>
        </nav>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
        <header>
            <div class="header-left">
                <button id="toggle-sidebar"
                    style="background: none; border: none; cursor: pointer; color: var(--stripe-slate);">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="cycle-badge">
                    <span style="width: 6px; height: 6px; background: #ef4444; border-radius: 50%;"></span>
                    Ciclo Escolar Activo: 2025-2026
                </div>
            </div>

            <div class="header-right">
                <div class="user-profile">
                    <div class="avatar">AD</div>
                    <span style="font-size: 14px; font-weight: 500; color: var(--stripe-dark);">Admin</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 9l6 6 6-6"></path>
                    </svg>
                </div>
            </div>
        </header>

        <content>
            {% block content %}{% endblock %}
        </content>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggle-sidebar');

        toggleBtn.addEventListener('click', () => {
            if (window.innerWidth > 991) {
                sidebar.classList.toggle('collapsed');
                localStorage.setItem('sidebar-collapsed', sidebar.classList.contains('collapsed'));
            } else {
                sidebar.classList.toggle('active');
            }
        });

        // Initialize state
        if (localStorage.getItem('sidebar-collapsed') === 'true' && window.innerWidth > 991) {
            sidebar.classList.add('collapsed');
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>

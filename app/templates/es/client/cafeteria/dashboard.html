{% extends "es/client/layout.html" %}

{% block title %}Cafetería - Akdmia{% endblock %}

{% block content %}
<style>
    .welcome-card {
        background: white;
        padding: 40px;
        border-radius: 12px;
        border: 1px solid #e6ebf1;
        text-align: center;
        box-shadow: 0 4px 6px rgba(50, 50, 93, 0.05);
    }

    .icon-box {
        width: 80px;
        height: 80px;
        background: #fffbeb;
        color: #f59e0b;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        margin: 0 auto 24px;
    }
</style>

<div class="welcome-card">
    <div class="icon-box">
        <i class="fas fa-utensils"></i>
    </div>
    <h1 style="color: var(--stripe-dark); margin-bottom: 12px;">Módulo de Cafetería</h1>
    <p style="color: var(--stripe-slate); margin-bottom: 32px;">Menú diario, gestión de pedidos y control de inventario.
    </p>

    <div style="padding: 24px; border: 1px dashed var(--stripe-light); border-radius: 8px; color: var(--stripe-light);">
        <i class="fas fa-tools" style="margin-right: 8px;"></i>
        Este módulo se encuentra actualmente en desarrollo.
    </div>
</div>
{% endblock %}

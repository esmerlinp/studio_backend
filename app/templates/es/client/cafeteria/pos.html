{% extends "es/client/layout.html" %}

{% block title %}POS Cafetería - Akdmia{% endblock %}

{% block content %}
<style>
    /* Premium POS Layout */
    .pos-container {
        display: grid;
        grid-template-columns: 1fr 400px;
        gap: 24px;
        height: calc(100vh - 120px);
    }

    /* Products Area */
    .products-column {
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .category-scroll {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding-bottom: 16px;
        scrollbar-width: none;
    }

    .category-chip {
        padding: 10px 24px;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 99px;
        white-space: nowrap;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
    }

    .category-chip.active {
        background: var(--accent-blue);
        color: white;
        border-color: var(--accent-blue);
    }

    .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 16px;
        overflow-y: auto;
        padding: 4px;
    }

    .pos-product-card {
        background: white;
        border-radius: 12px;
        padding: 16px;
        border: 1px solid #e2e8f0;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .pos-product-card:hover {
        border-color: var(--accent-blue);
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
    }

    /* Cart Column */
    .cart-column {
        background: white;
        border-radius: 20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #e2e8f0;
    }

    .cart-header {
        padding: 24px;
        border-bottom: 1px solid #e2e8f0;
    }

    .student-search-box {
        position: relative;
        margin-top: 12px;
    }

    .cart-items {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
    }

    .cart-item-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 16px;
        align-items: center;
    }

    .cart-footer {
        padding: 24px;
        background: #f8fafc;
        border-top: 1px solid #e2e8f0;
    }

    /* Safety Alerts */
    .safety-alert {
        padding: 16px;
        border-radius: 12px;
        margin-bottom: 16px;
        display: none;
        animation: slideIn 0.3s ease-out;
    }

    .alert-danger {
        background: #fee2e2;
        border: 1px solid #fecaca;
        color: #991b1b;
    }

    @keyframes slideIn {
        from {
            transform: translateY(-10px);
            opacity: 0;
        }

        to {
            transform: translateY(0);
            opacity: 1;
        }
    }
</style>

<div class="pos-container">
    <!-- Products Selection -->
    <div class="products-column">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">Nueva Venta</h2>
            <div class="search-wrap" style="width: 300px;">
                <input type="text" class="form-control" placeholder="Buscar producto..." id="productSearch">
            </div>
        </div>

        <div class="category-scroll" id="categoryList">
            <div class="category-chip active">Todos</div>
            <div class="category-chip">Bebidas</div>
            <div class="category-chip">Snacks</div>
            <div class="category-chip">Almuerzo</div>
        </div>

        <div class="product-grid" id="productGrid">
            <!-- Products injected by JS -->
        </div>
    </div>

    <!-- Right Sidebar Cart -->
    <div class="cart-column">
        <div class="cart-header">
            <h5 class="fw-bold mb-0">Detalle de la Orden</h5>
            <div class="student-search-box">
                <select id="studentSelect" class="form-select select2">
                    <option value="">Consumidor Final</option>
                </select>
                <div id="studentBalanceInfo" class="mt-2 small text-muted"></div>
            </div>
        </div>

        <div class="cart-items" id="cartItems">
            <!-- Cart items injected by JS -->
            <div class="text-center py-5 opacity-50">
                <i class="fas fa-shopping-basket fa-3x mb-3"></i>
                <p>Orden vacía</p>
            </div>
        </div>

        <div class="cart-footer">
            <!-- Safety Guards -->
            <div id="safetyAlert" class="safety-alert alert-danger">
                <div class="d-flex gap-2">
                    <i class="fas fa-shield-alt mt-1"></i>
                    <div>
                        <strong id="alertTitle">Bloqueo de Seguridad</strong>
                        <p id="alertMessage" class="small mb-0"></p>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between mb-2">
                <span class="text-secondary">Subtotal</span>
                <span class="fw-bold" id="subtotalText">$0.00</span>
            </div>
            <div class="d-flex justify-content-between mb-4">
                <span class="h4 fw-bold">Total</span>
                <span class="h4 fw-bold text-primary" id="totalText">$0.00</span>
            </div>

            <div class="d-grid gap-2">
                <button class="btn btn-primary btn-lg fw-bold" id="btnCheckoutWallet" disabled>
                    Pagar con Billetera
                </button>
                <button class="btn btn-outline-secondary" id="btnCheckoutCash">
                    Pago con Efectivo
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let posData = { products: [], students: [] };
    let cart = [];
    let selectedStudent = null;

    async function initPOS() {
        const response = await fetch('/api/v1/client/cafeteria/pos-data');
        posData = await response.json();
        
        renderProducts(posData.products);
        populateStudents(posData.students);
    }

    function renderProducts(products) {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = products.map(p => `
            <div class="pos-product-card" onclick="addToCart(${p.id})">
                <div class="mb-2">
                    <div style="font-size: 24px; color: var(--accent-orange);"><i class="fas fa-utensils"></i></div>
                </div>
                <div>
                    <div class="fw-bold small">${p.name}</div>
                    <div class="text-primary fw-bold">$${p.price.toFixed(2)}</div>
                </div>
            </div>
        `).join('');
    }

    function populateStudents(students) {
        const select = document.getElementById('studentSelect');
        students.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = `${s.name} (${s.code})`;
            select.appendChild(opt);
        });
    }

    function addToCart(productId) {
        const product = posData.products.find(p => p.id === productId);
        
        // Safety Cross-Check (Allergies)
        if (selectedStudent) {
            const conflict = product.allergens?.some(aId => selectedStudent.allergies.includes(aId));
            if (conflict) {
                showAlert("ALERTA MÉDICA", `El estudiante es ALÉRGICO a uno de los componentes de ${product.name}.`);
                return;
            }
        }

        const existing = cart.find(item => item.productId === productId);
        if (existing) {
            existing.quantity++;
        } else {
            cart.push({ ...product, productId: product.id, quantity: 1 });
        }
        
        renderCart();
    }

    function renderCart() {
        const container = document.getElementById('cartItems');
        if (cart.length === 0) {
            container.innerHTML = '<div class="text-center py-5 opacity-50"><i class="fas fa-shopping-basket fa-3x mb-3"></i><p>Orden vacía</p></div>';
            updateTotals(0);
            return;
        }

        container.innerHTML = cart.map((item, idx) => `
            <div class="cart-item-row">
                <div>
                    <div class="fw-bold">${item.name}</div>
                    <div class="small text-muted">${item.quantity} x $${item.price.toFixed(2)}</div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="fw-bold">$${(item.price * item.quantity).toFixed(2)}</span>
                    <button class="btn btn-sm btn-link text-danger" onclick="removeFromCart(${idx})"><i class="fas fa-times"></i></button>
                </div>
            </div>
        `).join('');

        const total = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
        updateTotals(total);
        checkFinancialSafety(total);
    }

    function updateTotals(total) {
        document.getElementById('subtotalText').textContent = `$${total.toFixed(2)}`;
        document.getElementById('totalText').textContent = `$${total.toFixed(2)}`;
    }

    function checkFinancialSafety(total) {
        const btnWallet = document.getElementById('btnCheckoutWallet');
        hideAlert();
        
        if (!selectedStudent) {
            btnWallet.disabled = true;
            return;
        }

        if (selectedStudent.balance < total) {
            showAlert("SALDO INSUFICIENTE", `El estudiante solo tiene $${selectedStudent.balance.toFixed(2)}.`);
            btnWallet.disabled = true;
        } else {
            btnWallet.disabled = false;
        }
    }

    function showAlert(title, message) {
        const alert = document.getElementById('safetyAlert');
        document.getElementById('alertTitle').textContent = title;
        document.getElementById('alertMessage').textContent = message;
        alert.style.display = 'block';
    }

    function hideAlert() {
        document.getElementById('safetyAlert').style.display = 'none';
    }

    document.getElementById('studentSelect').addEventListener('change', (e) => {
        const studentId = parseInt(e.target.value);
        selectedStudent = posData.students.find(s => s.id === studentId);
        
        const balanceInfo = document.getElementById('studentBalanceInfo');
        if (selectedStudent) {
            balanceInfo.textContent = `Saldo disponible: $${selectedStudent.balance.toFixed(2)}`;
        } else {
            balanceInfo.textContent = '';
        }
        
        renderCart(); // Re-validate cart with new student
    });

    // Initial load
    initPOS();
</script>
{% endblock %}

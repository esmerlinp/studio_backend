{% extends "es/client/layout.html" %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-3">
        <div class="col-12">
            <h4 class="mb-0">{% if ncf %}Editar{% else %}Nueva{% endif %} Secuencia NCF</h4>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form id="ncfForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tipo de NCF</label>
                            <select class="form-select" name="type_ncf" required>
                                <option value="">Seleccione...</option>
                                <option value="01" {% if ncf and ncf.type_ncf=='01' %}selected{% endif %}>01 - Crédito
                                    Fiscal</option>
                                <option value="02" {% if ncf and ncf.type_ncf=='02' %}selected{% endif %}>02 -
                                    Consumidor Final</option>
                                <option value="14" {% if ncf and ncf.type_ncf=='14' %}selected{% endif %}>14 - Regímenes
                                    Especiales</option>
                                <option value="15" {% if ncf and ncf.type_ncf=='15' %}selected{% endif %}>15 -
                                    Gubernamental</option>
                            </select>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Prefijo (Serie)</label>
                                <input type="text" class="form-control" name="prefix"
                                    value="{{ ncf.prefix if ncf else 'B' }}" required placeholder="Ej: B">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Último Secuencial Utilizado</label>
                                <input type="number" class="form-control" name="current_number"
                                    value="{{ ncf.current_number if ncf else '0' }}" required>
                                <div class="form-text">El sistema usará el siguiente número (N+1).</div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Límite Permitido</label>
                                <input type="number" class="form-control" name="max_number"
                                    value="{{ ncf.max_number if ncf else '' }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Fecha Vencimiento</label>
                                <input type="date" class="form-control" name="expiration_date"
                                    value="{{ ncf.expiration_date if ncf else '' }}" required>
                            </div>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="is_active" name="is_active" {% if ncf
                                and ncf.is_active %}checked{% endif %}>
                            <label class="form-check-label" for="is_active">Secuencia Activa</label>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a href="/client/financial/ncf" class="btn btn-light">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('ncfForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const formData = new FormData(this);
        const data = Object.fromEntries(formData.entries());
        data.is_active = document.getElementById('is_active').checked;
        data.current_number = parseInt(data.current_number);
        data.max_number = parseInt(data.max_number);

        const url = '{{ "/api/v1/client/financial/ncf/" + (ncf.id|string) if ncf else "/api/v1/client/financial/ncf" }}';
        const method = '{{ "PUT" if ncf else "POST" }}';

        try {
            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                window.location.href = '/client/financial/ncf';
            } else {
                alert('Error al guardar');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Error de conexión');
        }
    });
</script>
{% endblock %}

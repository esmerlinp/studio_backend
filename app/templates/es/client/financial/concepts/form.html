{% extends "es/client/layout.html" %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-3">
        <div class="col-12">
            <h4 class="mb-0">{% if concept %}Editar{% else %}Nuevo{% endif %} Concepto de Pago</h4>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form id="conceptForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre del Concepto</label>
                            <input type="text" class="form-control" name="name"
                                value="{{ concept.name if concept else '' }}" required>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-check form-switch mb-2">
                                    <input class="form-check-input" type="checkbox" id="isFamily" name="isFamily" {% if
                                        concept and concept.isFamily %}checked{% endif %}>
                                    <label class="form-check-label" for="isFamily">Es Cargo Familiar</label>
                                </div>
                                <div class="form-check form-switch mb-2">
                                    <input class="form-check-input" type="checkbox" id="isRecurrent" name="isRecurrent"
                                        {% if concept and concept.isRecurrent %}checked{% endif %}>
                                    <label class="form-check-label" for="isRecurrent">Es Recurrente</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check form-switch mb-2">
                                    <input class="form-check-input" type="checkbox" id="appliesDiscount"
                                        name="appliesDiscount" {% if concept and concept.appliesDiscount %}checked{%
                                        endif %}>
                                    <label class="form-check-label" for="appliesDiscount">Aplica Descuento</label>
                                </div>
                                <div class="form-check form-switch mb-2">
                                    <input class="form-check-input" type="checkbox" id="appliesSurcharge"
                                        name="appliesSurcharge" {% if concept and concept.appliesSurcharge %}checked{%
                                        endif %}>
                                    <label class="form-check-label" for="appliesSurcharge">Aplica Recargo</label>
                                </div>
                                <div class="form-check form-switch mb-2">
                                    <input class="form-check-input" type="checkbox" id="appliesItbis"
                                        name="appliesItbis" {% if concept and concept.appliesItbis %}checked{% endif %}>
                                    <label class="form-check-label" for="appliesItbis">Aplica ITBIS</label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="isActive" name="isActive" {% if concept
                                and concept.isActive %}checked{% endif %}>
                            <label class="form-check-label" for="isActive">Activo</label>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a href="/client/financial/concepts" class="btn btn-light">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('conceptForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const formData = new FormData(this);
        const data = Object.fromEntries(formData.entries());

        // Handle checkboxes manually as FormData only includes checked ones
        data.isFamily = document.getElementById('isFamily').checked;
        data.isRecurrent = document.getElementById('isRecurrent').checked;
        data.isActive = document.getElementById('isActive').checked;
        data.appliesDiscount = document.getElementById('appliesDiscount').checked;
        data.appliesSurcharge = document.getElementById('appliesSurcharge').checked;
        data.appliesItbis = document.getElementById('appliesItbis').checked;

        const url = '{{ "/api/v1/client/financial/concepts/" + (concept.id|string) if concept else "/api/v1/client/financial/concepts" }}';
        const method = '{{ "PUT" if concept else "POST" }}';

        try {
            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                window.location.href = '/client/financial/concepts';
            } else {
                alert('Error al guardar');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Error de conexión');
        }
    });
</script>
{% endblock %}

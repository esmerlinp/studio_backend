<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Solicitud de Admisión{% endblock %}</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --stripe-indigo: #635bff;
            --stripe-dark: #0a2540;
            --akdmia-bg: #fff5f8;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--akdmia-bg);
            color: var(--stripe-dark);
        }

        .public-header {
            padding: 20px 40px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 24px;
            color: var(--stripe-indigo);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .public-content {
            padding: 40px 20px;
        }

        .footer {
            text-align: center;
            padding: 40px;
            color: #718096;
            font-size: 14px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>
    <header class="public-header">
        <div class="logo">
            <i class="fas fa-graduation-cap"></i>
            <span>Akdmia</span>
        </div>
        <div id="schoolInfo" style="font-weight: 600; color: #4a5568;">
            <!-- School Name will be injected here -->
        </div>
    </header>

    <main class="public-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        &copy; 2026 Akdmia Studio. Todos los derechos reservados.
    </footer>

    {% block extra_js %}{% endblock %}
</body>

</html>

<style>
    /* AI Trigger Button in Header */
    .ai-trigger-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        background: transparent;
        color: var(--text-main);
        border: 1px solid var(--border);
        padding: 6px 12px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.2s;
    }

    .ai-trigger-btn:hover {
        background-color: var(--bg-body);
        border-color: #cbd5e1;
    }

    .ai-trigger-btn svg {
        width: 16px;
        height: 16px;
        color: var(--primary-color);
    }

    /* Modal Backdrop */
    #chat-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(4px);
        z-index: 9998;
        opacity: 0;
        visibility: hidden;
        transition: all 0.2s ease;
    }

    #chat-backdrop.active {
        opacity: 1;
        visibility: visible;
    }

    /* Centered Chat Modal - Clean Spotlight Style */
    #chat-window {
        position: fixed;
        top: 20%;
        /* Upper position like command palette */
        left: 50%;
        transform: translate(-50%, -10px) scale(0.98);
        width: 90%;
        max-width: 640px;
        height: 600px;
        max-height: 80vh;
        background-color: white;
        border-radius: 12px;
        box-shadow:
            0 0 0 1px rgba(0, 0, 0, 0.05),
            0 10px 15px -3px rgba(0, 0, 0, 0.1),
            0 4px 6px -2px rgba(0, 0, 0, 0.05),
            0 20px 25px -5px rgba(0, 0, 0, 0.1);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        opacity: 0;
        visibility: hidden;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        font-family: 'Inter', sans-serif;
    }

    #chat-window.active {
        transform: translate(-50%, 0) scale(1);
        opacity: 1;
        visibility: visible;
    }

    /* Header - Minimal */
    .chat-header {
        background: white;
        padding: 16px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
    }

    .chat-header-info {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .chat-icon-bg {
        color: var(--primary-color);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .chat-title h3 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        color: #111827;
    }

    .chat-title p {
        margin: 0;
        font-size: 0.75rem;
        color: #6b7280;
    }

    .close-btn {
        background: transparent;
        border: none;
        color: #9ca3af;
        cursor: pointer;
        padding: 4px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.2s;
    }

    .close-btn:hover {
        color: #111827;
        background-color: #f3f4f6;
    }

    /* Messages Area */
    #chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        background-color: white;
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    .message {
        display: flex;
        gap: 12px;
        max-width: 100%;
        animation: fadeIn 0.2s ease;
    }

    .message.user {
        flex-direction: row-reverse;
    }

    .message-bubble {
        padding: 0;
        font-size: 0.95rem;
        line-height: 1.6;
        color: #374151;
    }

    .message.user .message-bubble {
        background-color: #f3f4f6;
        padding: 8px 16px;
        border-radius: 8px;
        color: #111827;
        font-weight: 500;
    }

    .avatar {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: 700;
        flex-shrink: 0;
    }

    .avatar.ai-avatar {
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        color: white;
    }

    .avatar.user-avatar {
        background-color: #e5e7eb;
        color: #4b5563;
    }

    /* Context Badge */
    .context-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background-color: #f9fafb;
        color: #6b7280;
        border: 1px solid #e5e7eb;
        border-radius: 4px;
        padding: 2px 6px;
        font-size: 0.7rem;
        font-weight: 500;
        margin-bottom: 8px;
    }

    /* Input Area - Spotlight Style */
    .chat-input-area {
        padding: 16px 20px;
        background-color: white;
        border-top: 1px solid var(--border);
    }

    #chat-form {
        position: relative;
        display: flex;
        align-items: center;
    }

    #chat-input {
        width: 100%;
        padding: 12px 48px 12px 16px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        outline: none;
        font-size: 0.95rem;
        background-color: white;
        transition: all 0.2s;
        font-family: inherit;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    #chat-input:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
    }

    #send-button {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        background-color: #f3f4f6;
        color: #6b7280;
        border: none;
        width: 32px;
        height: 32px;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
    }

    #send-button:hover {
        background-color: #e5e7eb;
        color: #111827;
    }

    #send-button svg {
        width: 16px;
        height: 16px;
    }

    /* Animations */
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(5px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .loading-dots {
        display: flex;
        gap: 4px;
    }

    .loading-dot {
        width: 6px;
        height: 6px;
        background-color: #9ca3af;
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out both;
    }

    .loading-dot:nth-child(1) {
        animation-delay: -0.32s;
    }

    .loading-dot:nth-child(2) {
        animation-delay: -0.16s;
    }

    @keyframes bounce {

        0%,
        80%,
        100% {
            transform: scale(0);
        }

        40% {
            transform: scale(1);
        }
    }

    /* Markdown content styles */
    .message-content h1,
    .message-content h2,
    .message-content h3 {
        font-weight: 600;
        margin: 12px 0 8px;
        color: #111827;
        font-size: 1rem;
    }

    .message-content p {
        margin: 0 0 8px 0;
        color: #374151;
    }

    .message-content ul,
    .message-content ol {
        padding-left: 20px;
        margin: 8px 0;
    }

    .message-content li {
        margin-bottom: 4px;
    }

    .message-content code {
        background-color: #f3f4f6;
        padding: 2px 4px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 0.85em;
        color: #db2777;
    }

    .message-content pre {
        background-color: #f8fafc;
        padding: 12px;
        border-radius: 8px;
        overflow-x: auto;
        margin: 12px 0;
        border: 1px solid #e2e8f0;
    }

    .message-content pre code {
        background-color: transparent;
        color: inherit;
        padding: 0;
    }
</style>

<!-- Modal Backdrop -->
<div id="chat-backdrop" onclick="toggleChat()"></div>

<!-- Chat Window Modal -->
<div id="chat-window">

    <!-- Header -->
    <div class="chat-header">
        <div class="chat-header-info">
            <div class="chat-icon-bg">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
            </div>
            <div class="chat-title">
                <h3>Asistente Global</h3>
            </div>
        </div>
        <button class="close-btn" onclick="toggleChat()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>

    <!-- Messages Area -->
    <div id="chat-messages">
        <!-- Welcome Message -->
        <div id="welcome-message" class="message ai">
            <div class="avatar ai-avatar">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 16a6 6 0 1 1 6-6 6 6 0 0 1-6 6z"></path>
                </svg>
            </div>
            <div class="message-content">
                <div class="context-badge">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 0 1 9-9">
                        </path>
                    </svg>
                    <span>Modo: Global + <span id="context-name">Pagina</span></span>

    <div class="chat-input-area">
        <form id="chat-form" onsubmit="sendMessage(event)">

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    let chatHistory = [];
    let isProcessing = false;
    let pageContext = {};

    function getPageContext() {
        const mainContent = document.getElementById('main-content');
        const pageTitle = document.title;
        const url = window.location.href;

        let contentText = "";
        if (mainContent) {
            const clone = mainContent.cloneNode(true);
            const toRemove = clone.querySelectorAll('script, style, .no-context');
            toRemove.forEach(el => el.remove());
            contentText = clone.innerText.replace(/\s+/g, ' ').trim().substring(0, 5000);
        }

        const forms = document.querySelectorAll('form');
        let formData = {};
        forms.forEach((form, index) => {
            const data = new FormData(form);
            const obj = {};
            data.forEach((value, key) => obj[key] = value);
            formData[`form_${index}`] = obj;
        });

        return {
            title: pageTitle,
            url: url,
            content: contentText,
            formData: formData
        };
    }

    function toggleChat() {
        const windowEl = document.getElementById('chat-window');
        const backdrop = document.getElementById('chat-backdrop');
        const input = document.getElementById('chat-input');

        if (windowEl.classList.contains('active')) {
            windowEl.classList.remove('active');
            backdrop.classList.remove('active');
        } else {
            pageContext = getPageContext();
            document.getElementById('context-name').textContent = document.title.split('|')[0].trim();

            windowEl.classList.add('active');
            backdrop.classList.add('active');
            setTimeout(() => input.focus(), 100);
        }
    }

    async function sendMessage(e) {
        e.preventDefault();
        const input = document.getElementById('chat-input');
        const message = input.value.trim();

        if (!message || isProcessing) return;

        addMessageUI('user', message);
        input.value = '';

        isProcessing = true;
        const sendBtn = document.getElementById('send-button');
        sendBtn.disabled = true;

        const loadingId = addLoadingUI();
        scrollToBottom();

        try {
            const response = await fetch('/api/v1/master/chatbot/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: message,
                    history: chatHistory,
                    context: pageContext
                })
            });

            const loadingEl = document.getElementById(loadingId);
            if (loadingEl) loadingEl.remove();

            const data = await response.json();

            if (response.ok) {
                const aiResponse = data.data.response;
                addMessageUI('ai', aiResponse);
                chatHistory.push({ role: 'user', content: message });
                chatHistory.push({ role: 'model', content: aiResponse });
            } else {
                addMessageUI('error', 'Error al procesar.');
            }

        } catch (error) {
            const loadingEl = document.getElementById(loadingId);
            if (loadingEl) loadingEl.remove();
            addMessageUI('error', 'Error de conexión.');
            console.error(error);
        } finally {
            isProcessing = false;
            sendBtn.disabled = false;
            scrollToBottom();
            input.focus();
        }
    }

    function addMessageUI(role, text) {
        const messagesDiv = document.getElementById('chat-messages');
        const div = document.createElement('div');
        div.className = `message ${role}`;

        let contentHtml = '';
        if (role === 'user') {
            contentHtml = `
                <div class="message-bubble">
                    ${escapeHtml(text)}
                </div>
            `;
        } else if (role === 'ai') {
            const parsedText = marked.parse(text);
            contentHtml = `
                <div class="avatar ai-avatar">
                   <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 16a6 6 0 1 1 6-6 6 6 0 0 1-6 6z"></path>
                    </svg>
                </div>
                <div class="message-bubble message-content">
                    ${parsedText}
                </div>
            `;
        } else {
            contentHtml = `
                <div class="message-bubble" style="color: #ef4444;">
                    ${text}
                </div>
            `;
        }

        div.innerHTML = contentHtml;
        messagesDiv.appendChild(div);
    }

    function addLoadingUI() {
        const messagesDiv = document.getElementById('chat-messages');
        const id = 'loading-' + Date.now();
        const div = document.createElement('div');
        div.id = id;
        div.className = 'message ai';
        div.innerHTML = `
            <div class="avatar ai-avatar">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 16a6 6 0 1 1 6-6 6 6 0 0 1-6 6z"></path>
                    </svg>
            </div>
            <div class="message-bubble">
                <div class="loading-dots">
                    <div class="loading-dot"></div>
                    <div class="loading-dot"></div>
                    <div class="loading-dot"></div>
                </div>
            </div>
        `;
        messagesDiv.appendChild(div);
        return id;
    }

    function scrollToBottom() {
        const messagesDiv = document.getElementById('chat-messages');
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, function (m) { return map[m]; });
    }
</script>

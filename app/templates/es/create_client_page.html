<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cliente | {{ app_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="py-10 px-4">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-sm border border-gray-200">
        <div class="p-6 border-b border-gray-100">
            <h1 class="text-2xl font-bold text-gray-800">Registrar Nuevo Cliente</h1>
            <p class="text-gray-500 text-sm">Complete los datos para crear la cuenta y el esquema del cliente.</p>
        </div>

        <form id="clientForm" class="p-8 space-y-8">
            <div>
                <h2 class="text-lg font-semibold text-indigo-600 mb-4 flex items-center">
                    <span class="w-8 h-8 bg-indigo-50 rounded-full flex items-center justify-center mr-2 text-sm">01</span>
                    Información General
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Comercial</label>
                        <input type="text" name="name" required placeholder="Ej: Colegio Loyola" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Razón Social</label>
                        <input type="text" name="business_name" required placeholder="Ej: Instituto Loyola, S.A." class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Documento ID</label>
                        <input type="number" name="document_type_id" required placeholder="1" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Número de Documento</label>
                        <input type="text" name="document_number" required placeholder="RNC-101234567" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    </div>
                </div>
            </div>

            <hr class="border-gray-100">

            <div>
                <h2 class="text-lg font-semibold text-indigo-600 mb-4 flex items-center">
                    <span class="w-8 h-8 bg-indigo-50 rounded-full flex items-center justify-center mr-2 text-sm">02</span>
                    Contacto Directo
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Persona de Contacto</label>
                        <input type="text" name="contact_name" required placeholder="Juan Pérez" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div class="col-span-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tipo Tel.</label>
                            <input type="number" name="phone_type_id" required placeholder="1" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
                            <input type="text" name="contact_phone" required placeholder="809-555-1234" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition">
                        </div>
                    </div>
                </div>
            </div>

            <hr class="border-gray-100">

            <div>
                <h2 class="text-lg font-semibold text-indigo-600 mb-4 flex items-center">
                    <span class="w-8 h-8 bg-indigo-50 rounded-full flex items-center justify-center mr-2 text-sm">03</span>
                    Datos de Facturación
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email Facturación</label>
                        <input type="email" name="billing_email" required placeholder="facturacion@dominio.com" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">País ID</label>
                        <input type="number" name="billing_country_id" required value="1" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Ciudad ID</label>
                        <input type="number" name="billing_city_id" required placeholder="10" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Sector ID</label>
                        <input type="number" name="billing_sector_id" required placeholder="5" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    </div>
                    <div class="md:col-span-3">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Dirección Completa</label>
                        <input type="text" name="billing_address" required placeholder="Av. Principal #123..." class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    </div>
                </div>
            </div>

            <hr class="border-gray-100">

            <div class="bg-gray-50 p-6 rounded-xl border border-gray-100">
                <h2 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
                    ⚙️ Configuración del Sistema
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Esquema (DB)</label>
                        <input type="text" name="schema_name" required placeholder="ej: loyola" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition font-mono text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Fecha Inicio Servicio</label>
                        <input type="date" name="service_start_date" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Comentarios</label>
                        <textarea name="comment" rows="2" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition"></textarea>
                    </div>
                    <div class="flex items-center space-x-3">
                        <input type="checkbox" name="is_active" id="is_active" checked class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500">
                        <label for="is_active" class="text-sm font-medium text-gray-700">Cliente Activo</label>
                    </div>
                </div>
            </div>

            <div class="flex justify-end pt-6">
                <button type="submit" id="submitBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-10 rounded-lg shadow-lg transition duration-200 transform hover:scale-105">
                    Registrar Cliente
                </button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('clientForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Procesando...';

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            // Convertir campos numéricos y booleanos
            data.phone_type_id = parseInt(data.phone_type_id);
            data.document_type_id = parseInt(data.document_type_id);
            data.billing_country_id = parseInt(data.billing_country_id);
            data.billing_city_id = parseInt(data.billing_city_id);
            data.billing_sector_id = parseInt(data.billing_sector_id);
            data.is_active = document.getElementById('is_active').checked;

            try {
                const response = await fetch("{{ submit_url }}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    alert('¡Cliente registrado con éxito!');
                    // Opcional: window.location.href = '/success';
                } else {
                    alert('Error al registrar cliente.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Ocurrió un error en la conexión.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Registrar Cliente';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cliente | {{ app_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        
        /* Estilos base para las tarjetas */
        .plan-card { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            cursor: pointer; 
            border: 2px solid #e5e7eb;
            position: relative;
            overflow: hidden;
        }

        /* Colores dinámicos por tipo de plan */
        .plan-trial.selected { border-color: #10b981; background-color: #f0fdf4; }
        .plan-basic.selected { border-color: #6366f1; background-color: #f5f3ff; }
        .plan-standard.selected { border-color: #1a73e8; background-color: #eff6ff; }

        /* Efecto de elevación al seleccionar */
        .plan-card.selected { 
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .loader { border-top-color: #1a73e8; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="py-12 px-4">

    <div class="max-w-3xl mx-auto">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-gray-900 tracking-tight">{{ app_name }}</h1>
            <p class="text-gray-500 mt-2">Configuración de nueva cuenta de cliente</p>
        </div>

        <form id="onboardForm" class="space-y-6">
            <div class="bg-white p-8 rounded-xl border border-gray-200 shadow-sm">
                <h2 class="text-lg font-semibold text-gray-800 mb-6 flex items-center">
                    <span class="w-7 h-7 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center mr-3 text-xs">01</span>
                    Información de la Institución
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Razón Social</label>
                        <input type="text" name="business_name" required placeholder="Ej: Colegio Marcos Juárez" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Teléfono de Contacto</label>
                        <input type="text" name="contact_phone" required placeholder="809-555-5888" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                </div>
            </div>

            <div class="bg-white p-8 rounded-xl border border-gray-200 shadow-sm">
                <h2 class="text-lg font-semibold text-gray-800 mb-6 flex items-center">
                    <span class="w-7 h-7 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center mr-3 text-xs">02</span>
                    Usuario Administrador
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Nombre</label>
                        <input type="text" name="first_name" required placeholder="Marcos" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Apellido</label>
                        <input type="text" name="last_name" required placeholder="Juárez" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Correo Electrónico</label>
                        <input type="email" name="email" required placeholder="admin@institucion.com" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                </div>
            </div>

            <div class="bg-white p-8 rounded-xl border border-gray-200 shadow-sm">
                <h2 class="text-lg font-semibold text-gray-800 mb-2 flex items-center">
                    <span class="w-7 h-7 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center mr-3 text-xs">03</span>
                    Seleccionar Plan de Servicio
                </h2>
                <p class="text-sm text-gray-500 mb-6 ml-10">Diferenciados por capacidad y nivel de soporte.</p>
                
                <div id="plansContainer" class="grid grid-cols-1 gap-4">
                    <div class="flex justify-center py-4">
                        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-8 w-8"></div>
                    </div>
                </div>
                <input type="hidden" name="plan_id" id="selected_plan_id" required>
                <input type="hidden" name="price_list_id" id="selected_price_id" required>
            </div>

            <div class="flex flex-col items-center pt-4">
                <button type="submit" id="submitBtn" class="w-full md:w-auto px-12 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-md transition transform hover:-translate-y-0.5 active:scale-95 disabled:opacity-50">
                    Completar Registro
                </button>
            </div>
        </form>
    </div>

    <script>
        async function fetchPlans() {
            try {
                const response = await fetch('/api/v1/plans');
                const result = await response.json();
                if (result.success) renderPlans(result.data);
            } catch (error) {
                document.getElementById('plansContainer').innerHTML = '<p class="text-red-500 text-sm">Error al cargar planes.</p>';
            }
        }

        function renderPlans(plans) {
            const container = document.getElementById('plansContainer');
            container.innerHTML = '';

            plans.forEach(plan => {
                const price = plan.price_info.price;
                const cycle = plan.price_info.billing_cycle === 'ANNUAL' ? 'año' : 'mes';
                
                // Determinamos la clase de color según el código del plan
                let colorClass = 'plan-standard'; // Default
                let iconColor = 'text-blue-500';
                
                if (plan.code.includes('TRIAL')) {
                    colorClass = 'plan-trial';
                    iconColor = 'text-emerald-500';
                } else if (plan.code.includes('BASIC')) {
                    colorClass = 'plan-basic';
                    iconColor = 'text-indigo-500';
                }

                const card = document.createElement('div');
                card.className = `plan-card ${colorClass} p-5 rounded-xl flex items-center justify-between hover:shadow-md`;
                card.onclick = () => selectPlan(card, plan.id, plan.price_info.id, plan.code);
                
                card.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <div class="radio-circle w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center bg-white">
                            <div class="inner-dot w-3 h-3 rounded-full hidden"></div>
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="font-bold text-gray-900">${plan.name}</h3>
                                ${plan.code === 'STANDARD' ? '<span class="bg-blue-100 text-blue-700 text-[10px] px-2 py-0.5 rounded-full font-bold uppercase">Recomendado</span>' : ''}
                            </div>
                            <p class="text-xs text-gray-500 mt-1">${plan.description}</p>
                            <div class="flex gap-4 mt-2">
                                <span class="text-[11px] font-medium text-gray-400 flex items-center">
                                    <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                    ${plan.max_users} usuarios
                                </span>
                                <span class="text-[11px] font-medium text-gray-400 flex items-center">
                                    <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
                                    ${plan.max_storage_gb}GB
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-xl font-extrabold text-gray-900">${price > 0 ? '$' + price : 'Gratis'}</span>
                        <p class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">${price > 0 ? cycle : 'Prueba'}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function selectPlan(element, planId, priceId, code) {
            document.querySelectorAll('.plan-card').forEach(c => {
                c.classList.remove('selected');
                c.querySelector('.inner-dot').classList.add('hidden');
                c.querySelector('.inner-dot').className = 'inner-dot w-3 h-3 rounded-full hidden';
            });

            element.classList.add('selected');
            const dot = element.querySelector('.inner-dot');
            dot.classList.remove('hidden');

            // Color del punto interno según el plan
            if(code.includes('TRIAL')) dot.classList.add('bg-emerald-500');
            else if(code.includes('BASIC')) dot.classList.add('bg-indigo-500');
            else dot.classList.add('bg-blue-600');
            
            document.getElementById('selected_plan_id').value = planId;
            document.getElementById('selected_price_id').value = priceId;
        }

        // Script de envío se mantiene igual que el anterior...
        document.getElementById('onboardForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const formData = new FormData(e.target);
            const raw = Object.fromEntries(formData.entries());

            const payload = {
                client_data: { business_name: raw.business_name, contact_phone: raw.contact_phone },
                user_data: { first_name: raw.first_name, last_name: raw.last_name, email: raw.email },
                plan_data: { plan_id: parseInt(raw.plan_id), price_list_id: parseInt(raw.price_list_id) }
            };

            btn.disabled = true;
            btn.innerText = 'Procesando...';

            try {
                const response = await fetch("/api/v1/clients/onboard", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (response.ok) alert('¡Registro exitoso!');
                else alert('Error en el registro');
            } catch (error) {
                alert('Error de conexión');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Completar Registro';
            }
        });

        fetchPlans();
    </script>
</body>
</html>

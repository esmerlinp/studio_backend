<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Mi Sistema</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --text-color: #1f2937;
            --text-muted: #6b7280;
            --background-color: #f3f4f6;
            --card-background: white;
            --border-color: #e5e7eb;
            --error-color: #ef4444;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--background-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: var(--card-background);
            padding: 40px 32px;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }

        h2 {
            font-size: 1.5rem;
            color: var(--text-color);
            margin-bottom: 8px;
            font-weight: 700;
            text-align: center;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-color);
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .options {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .link-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 500;
            padding: 0;
        }

        .link-btn:hover {
            text-decoration: underline;
        }

        button.main-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        button.main-btn:hover {
            background: var(--primary-hover);
        }

        .footer-text {
            margin-top: 24px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .hidden { display: none; }

        #message {
            margin-top: 15px;
            font-size: 0.875rem;
            text-align: center;
            min-height: 20px;
        }

        .error-msg { color: var(--error-color); }
    </style>
</head>
<body>

<div class="card">
    <div id="login-view">
        <h2>Bienvenido</h2>
        <p class="subtitle">Ingresa tus credenciales para acceder</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="login-username">Nombre de usuario</label>
                <input type="text" id="login-username" placeholder="Tu usuario" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <div class="options">
                <button type="button" class="link-btn" onclick="toggleViews('forgot-view')">¿Olvidaste tu contraseña?</button>
            </div>

            <button type="submit" class="main-btn">Iniciar Sesión</button>
        </form>

        <p class="footer-text">
            ¿No tienes cuenta? <button class="link-btn" onclick="window.location.href='/register'">Regístrate</button>
        </p>
    </div>

    <div id="forgot-view" class="hidden">
        <h2>Recuperar acceso</h2>
        <p class="subtitle">Ingresa tu correo para recibir un enlace de recuperación.</p>

        <form id="forgotForm">
            <div class="form-group">
                <label for="reset-email">Correo electrónico asociado</label>
                <input type="email" id="reset-email" placeholder="ejemplo@correo.com" required>
            </div>

            <button type="submit" class="main-btn">Enviar enlace</button>
        </form>

        <p class="footer-text">
            <button class="link-btn" onclick="toggleViews('login-view')">← Volver al login</button>
        </p>
    </div>

    <div id="message"></div>
</div>

<script>
    const loginView = document.getElementById('login-view');
    const forgotView = document.getElementById('forgot-view');
    const message = document.getElementById('message');

    function toggleViews(viewId) {
        message.innerHTML = ""; 
        if (viewId === 'forgot-view') {
            loginView.classList.add('hidden');
            forgotView.classList.remove('hidden');
        } else {
            forgotView.classList.add('hidden');
            loginView.classList.remove('hidden');
        }
    }

    // Manejo del Login con Username
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;

        try {
            const response = await fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (response.ok) {
                window.location.href = '/dashboard';
            } else {
                const data = await response.json();
                message.innerHTML = `<p class="error-msg">${data.error || 'Usuario o contraseña incorrectos'}</p>`;
            }
        } catch (err) {
            message.innerHTML = `<p class="error-msg">Error de conexión con el servidor</p>`;
        }
    });

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        message.innerHTML = "<p style='color: var(--primary-color)'>Si el correo está registrado, recibirás un enlace pronto.</p>";
    });
</script>

</body>
</html>

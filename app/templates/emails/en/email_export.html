<!DOCTYPE html>
<html>
<head>
    <style>
        .button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 8px;
        }
        .container { font-family: sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: auto; }
        .footer { font-size: 12px; color: #777; margin-top: 20px; border-top: 1px solid #ddd; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>{{ subject }}</h2>
        <p>{{ greeting }}, <strong>{{ client_name }}</strong>:</p>
        <p>{{ message_body }}</p>
        
        <div style="text-align: center; margin: 30px 0;">
            <a href="{{ download_url }}" class="button" style="color: white;">{{ button_text }}</a>
        </div>

        <p>{{ warning_text }}</p>
        
        <div class="footer">
            <p>{{ footer_text }} {{ app_name }}</p>
        </div>
    </div>
</body>
</html>

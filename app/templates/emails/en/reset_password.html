<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* Variables and Basic Reset */
        :root {
            --primary-color: #4f46e5; /* Indigo */
            --primary-hover: #4338ca;
            --text-color: #1f2937;
            --background-color: #f9fafb;
            --card-background: white;
            --border-color: #e5e7eb;
            --success-color: #10b981; /* Emerald */
            --error-color: #ef4444; /* Red */
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--background-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Card Style */
        .card {
            background: var(--card-background);
            padding: 32px;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        h2 {
            font-size: 1.75rem;
            color: var(--text-color);
            margin-bottom: 24px;
            text-align: center;
            font-weight: 700;
        }

        /* Input Field Styles */
        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            color: var(--text-color);
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        /* Button Styles */
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:disabled {
            background: #d1d5db;
            cursor: not-allowed;
        }

        /* Message Styles (Error/Success) */
        #message {
            margin-top: 15px;
            text-align: center;
        }
        
        .error {
            color: var(--error-color);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px;
            background-color: #fee2e2;
            border-radius: 4px;
        }

        .success {
            color: var(--success-color);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px;
            background-color: #d1fae5;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Change Password</h2>

    <form id="resetForm">
        <input
            type="password"
            id="password"
            placeholder="New Password"
            required
        />

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            required
        />

        <button type="submit">Change Password</button>
    </form>

    <div id="message"></div>
</div>

<script>
    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");

    // Get token from URL
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token) {
        // Message translated to English
        message.innerHTML = "<p class='error'>Invalid Token</p>";
        form.style.display = "none";
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (password.length < 8) {
            // Message translated to English
            message.innerHTML = "<p class='error'>Password must be at least 8 characters long</p>";
            return;
        }

        if (password !== confirmPassword) {
            // Message translated to English
            message.innerHTML = "<p class='error'>Passwords do not match</p>";
            return;
        }

        try {
            const response = await fetch("/auth/reset-password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    token: token,
                    password: password
                })
            });

            const data = await response.json();

            if (!response.ok) {
                // Message translated to English
                message.innerHTML = `<p class='error'>${data.error || "Error changing password"}</p>`;
                return;
            }

            // Message translated to English
            message.innerHTML = "<p class='success'>Password updated successfully</p>";
            form.reset();

        } catch (error) {
            // Message translated to English
            message.innerHTML = "<p class='error'>Connection error</p>";
        }
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambiar contraseña</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* Variables y Reset Básico */
        :root {
            --primary-color: #4f46e5; /* Índigo */
            --primary-hover: #4338ca;
            --text-color: #1f2937;
            --background-color: #f9fafb;
            --card-background: white;
            --border-color: #e5e7eb;
            --success-color: #10b981; /* Esmeralda */
            --error-color: #ef4444; /* Rojo */
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--background-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Estilo de la Tarjeta (Card) */
        .card {
            background: var(--card-background);
            padding: 32px;
            width: 100%;
            max-width: 400px; /* Un poco más compacto */
            border-radius: 12px; /* Esquinas más redondeadas */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); /* Sombra más suave y moderna */
            border: 1px solid var(--border-color); /* Borde sutil */
        }

        h2 {
            font-size: 1.75rem; /* Más prominente */
            color: var(--text-color);
            margin-bottom: 24px;
            text-align: center;
            font-weight: 700;
        }

        /* Estilos de Campos de Entrada */
        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            color: var(--text-color);
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box; /* Asegura que el padding no cambie el ancho total */
        }

        input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); /* Anillo de enfoque sutil */
        }

        /* Estilos del Botón */
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px; /* Más espacio sobre el botón */
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:disabled {
            background: #d1d5db; /* Gris más claro y moderno */
            cursor: not-allowed;
        }

        /* Estilos de Mensajes (Error/Éxito) */
        #message {
            margin-top: 15px;
            text-align: center;
        }
        
        .error {
            color: var(--error-color);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px;
            background-color: #fee2e2; /* Fondo rojo claro */
            border-radius: 4px;
        }

        .success {
            color: var(--success-color);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px;
            background-color: #d1fae5; /* Fondo verde claro */
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Cambiar contraseña</h2>

    <form id="resetForm">
        <input
            type="password"
            id="password"
            placeholder="Nueva contraseña"
            required
        />

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirmar contraseña"
            required
        />

        <button type="submit">Cambiar contraseña</button>
    </form>

    <div id="message"></div>
</div>

<script>
    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");

    // Obtener token desde la URL
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token) {
        message.innerHTML = "<p class='error'>Token inválido</p>";
        form.style.display = "none";
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (password.length < 8) {
            message.innerHTML = "<p class='error'>La contraseña debe tener al menos 8 caracteres</p>";
            return;
        }

        if (password !== confirmPassword) {
            message.innerHTML = "<p class='error'>Las contraseñas no coinciden</p>";
            return;
        }

        try {
            const response = await fetch("/auth/reset-password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    token: token,
                    password: password
                })
            });

            const data = await response.json();

            if (!response.ok) {
                message.innerHTML = `<p class='error'>${data.error || "Error al cambiar la contraseña"}</p>`;
                return;
            }

            message.innerHTML = "<p class='success'>Contraseña actualizada correctamente</p>";
            form.reset();

        } catch (error) {
            message.innerHTML = "<p class='error'>Error de conexión</p>";
        }
    });
</script>

</body>
</html>
